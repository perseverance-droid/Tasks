<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>海绵宝宝主题登录页</title>
  <link rel="stylesheet" href="styleh.css" /> <!-- 引入CSS样式文件 -->
</head>
<body>

   <div class="login-box">
      <h2>Login</h2>
      <form>
        <div class="form-item">
          <label for="username">用户名：</label>
          <input
            type="text"
            id="username"
            placeholder="用户名"
            required
          />
        </div>
        <div class="form-item">
          <label for="password">密 码：</label>
          <input
            type="password"
            id="password"
            placeholder="密码"
            required
          />
          <br>
    <button type="submit" class="login-btn">登 录</button>
</body>
